<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lintuhavainnot</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body { font-family: system-ui; margin: 0; background: #f6f7f8; }
    header { background: #2e7d32; color: white; padding: 1rem; text-align: center; }
    .version { font-size: 0.75rem; opacity: 0.8; }
    main { padding: 1rem; max-width: 720px; margin: auto; }

    .auth { background: white; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }

    .total {
      background: #1b5e20;
      color: white;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      cursor: pointer;
    }

    .total.blue { background: #1565c0; }

    .success-message {
      background: #4caf50;
      color: white;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 1rem;
      transform: translateY(-100%);
      opacity: 0;
      transition: 0.3s;
    }
    .success-message.show {
      transform: translateY(0);
      opacity: 1;
    }

    form { background: white; padding: 1.5rem; border-radius: 12px; display:flex; flex-direction:column; gap:1rem; }
    input, button { width:100%; padding:0.8rem; border-radius:8px; border:1px solid #ccc; }
    button { background:#2e7d32; color:white; border:none; }

    #map { height:280px; border-radius:12px; display:none; }

    ul { list-style:none; padding:0; }
    li { background:white; margin-top:0.5rem; padding:0.75rem; border-radius:10px; }

    .suggestions { background:white; border:1px solid #ccc; border-radius:8px; position:absolute; width:100%; }
    .suggestions div { padding:0.5rem; cursor:pointer; }
  </style>
</head>

<body>
<header>
  <h1>🦉 Lintuhavainnot</h1>
  <div class="version">v1.11</div>
</header>

<main>

<div class="auth">
  <input id="email" placeholder="Sähköposti">
  <input id="password" type="password" placeholder="Salasana">
  <button id="loginBtn">Kirjaudu / Rekisteröidy</button>
  <button id="logoutBtn" style="display:none">Kirjaudu ulos</button>
</div>

<div id="successMessage" class="success-message">✅ Tallennettu!</div>

<div id="totalCount" class="total">Kirjaudu sisään</div>

<form id="observationForm" style="display:none">
  
  <label>Laji
    <input id="species">
    <div id="suggestions" class="suggestions"></div>
  </label>

  <!-- ✅ UUSI -->
  <label>Päivä ja kellonaika
    <input type="datetime-local" id="datetime">
  </label>

  <button type="submit">Tallenna havainto</button>

  <div id="map"></div>
</form>

<ul id="observations"></ul>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script type="module">
import { speciesList } from "./species.js";

firebase.initializeApp({
  apiKey: "AIza...",
  authDomain: "linnut2026.firebaseapp.com",
  projectId: "linnut2026"
});

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let unsubscribe = null;

/* ELEMENTIT */
const email = document.getElementById("email");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const total = document.getElementById("totalCount");
const form = document.getElementById("observationForm");
const list = document.getElementById("observations");
const species = document.getElementById("species");
const suggestions = document.getElementById("suggestions");
const datetimeInput = document.getElementById("datetime");
const success = document.getElementById("successMessage");

/* LOGIN */
loginBtn.onclick = async () => {
  try {
    await auth.signInWithEmailAndPassword(email.value, password.value);
  } catch {
    await auth.createUserWithEmailAndPassword(email.value, password.value);
  }
};

logoutBtn.onclick = () => auth.signOut();

/* AUTH */
auth.onAuthStateChanged(user => {
  currentUser = user;

  if (!user) {
    form.style.display = "none";
    loginBtn.style.display = "block";
    logoutBtn.style.display = "none";
    total.textContent = "Kirjaudu sisään";
    list.innerHTML = "";
    return;
  }

  form.style.display = "block";
  loginBtn.style.display = "none";
  logoutBtn.style.display = "block";

  load();
});

/* AUTOCOMPLETE */
species.oninput = () => {
  suggestions.innerHTML = "";
  const q = species.value.toLowerCase();
  speciesList.filter(s => s.toLowerCase().startsWith(q)).slice(0,10).forEach(s => {
    const d = document.createElement("div");
    d.textContent = s;
    d.onclick = () => { species.value = s; suggestions.innerHTML = ""; };
    suggestions.appendChild(d);
  });
};

/* SIJAINTI */
let lat, lon;
navigator.geolocation?.getCurrentPosition(p => {
  lat = p.coords.latitude;
  lon = p.coords.longitude;
  const map = L.map("map").setView([lat, lon], 13);
  document.getElementById("map").style.display = "block";
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
});

/* LOAD */
function load() {
  if (unsubscribe) unsubscribe();

  unsubscribe = db.collection("observations")
    .where("uid","==",currentUser.uid)
    .orderBy("timestamp","desc")
    .onSnapshot(snap => {
      list.innerHTML = "";
      total.textContent = `Havaintoja: ${snap.size}`;

      snap.forEach(doc => {
        const li = document.createElement("li");
        li.textContent = doc.data().species + " – " + new Date(doc.data().timestamp).toLocaleString();
        list.appendChild(li);
      });
    });
}

/* SAVE */
form.onsubmit = async e => {
  e.preventDefault();
  if (!species.value.trim()) return;

  let ts = datetimeInput.value
    ? new Date(datetimeInput.value).getTime()
    : Date.now();

  await db.collection("observations").add({
    uid: currentUser.uid,
    species: species.value,
    timestamp: ts,
    lat,
    lon
  });

  form.reset();
  suggestions.innerHTML = "";

  success.classList.add("show");
  setTimeout(()=>success.classList.remove("show"),2000);
};
</script>
</body>
</html>
